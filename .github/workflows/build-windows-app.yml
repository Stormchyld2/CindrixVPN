name: Build Cindrix VPN (Windows)
on:
  push:
    paths: ["app/**", ".github/workflows/build-windows-app.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        run: dotnet publish app/CindrixVPN/CindrixVPN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: CindrixVPN-win-x64
          path: out/CindrixVPN.exe
